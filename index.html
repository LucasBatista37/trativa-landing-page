<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary SEO -->
    <title>Trativa — CRM de Leads para Equipes Comerciais Brasileiras</title>
    <meta name="description" content="CRM de leads com pipeline Kanban de 9 etapas, WhatsApp oficial (Cloud API), metas, funil de vendas e app Android. Teste grátis por 30 dias, sem cartão de crédito." />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://trativa.app/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://trativa.app/" />
    <meta property="og:title" content="Trativa — CRM de Leads para Equipes Comerciais" />
    <meta property="og:description" content="Pipeline Kanban, WhatsApp Cloud API oficial, campos personalizados, funil de vendas e app Android. Teste grátis por 30 dias, sem cartão." />
    <meta property="og:image" content="https://trativa.app/og-trativa-simple-system.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:alt" content="Trativa — CRM para organizar leads, WhatsApp oficial e relatórios em tempo real" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:site_name" content="Trativa" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Trativa — CRM de Leads" />
    <meta name="twitter:description" content="Gerencie leads, envie WhatsApp e acompanhe metas. Teste grátis por 30 dias, sem cartão." />
    <meta name="twitter:image" content="https://trativa.app/og-trativa-simple-system.png" />
    <meta name="twitter:image:alt" content="Trativa — CRM para organizar leads, WhatsApp oficial e relatórios em tempo real" />

    <!-- Theme -->
    <meta name="theme-color" content="#0A1630" />

    <!-- Fontes: Bricolage Grotesque (títulos) + Inter (texto, a mesma família do app) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- carregamento sem bloquear a renderização (texto aparece com a fonte do sistema e troca em seguida) -->
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Inter:wght@400;500;600;700&display=swap" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Inter:wght@400;500;600;700&display=swap" media="print" onload="this.media='all'" />
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Inter:wght@400;500;600;700&display=swap" /></noscript>

    <!-- LCP: quadro inicial da gravação real do pipeline (desktop) -->
    <link rel="preload" as="image" type="image/avif" href="/media/video/hero-kanban-poster.avif" media="(min-width: 768px)" fetchpriority="high" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
