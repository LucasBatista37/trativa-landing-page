<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="cover-title cover-desc">
  <title id="cover-title">Velocidade de resposta ao lead</title>
  <desc id="cover-desc">Cronômetro marcando 5 minutos ao lado de conversas de WhatsApp e um funil de vendas com etapas coloridas</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0f1e" />
      <stop offset="45%" stop-color="#0d1530" />
      <stop offset="100%" stop-color="#050810" />
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)" />
  <circle cx="330" cy="300" r="230" fill="#2563eb" opacity="0.12" />
  <circle cx="960" cy="150" r="160" fill="#10b981" opacity="0.08" />

  <!-- Stopwatch -->
  <g>
    <rect x="308" y="118" width="44" height="26" rx="8" fill="#93c5fd" />
    <line x1="410" y1="130" x2="440" y2="100" stroke="#93c5fd" stroke-width="10" stroke-linecap="round" />
    <circle cx="330" cy="290" r="140" fill="none" stroke="url(#accent)" stroke-width="14" />
    <circle cx="330" cy="290" r="114" fill="#111a33" />
    <line x1="330" y1="290" x2="330" y2="205" stroke="#60a5fa" stroke-width="8" stroke-linecap="round" />
    <line x1="330" y1="290" x2="385" y2="290" stroke="#e2e8f0" stroke-width="8" stroke-linecap="round" />
    <circle cx="330" cy="290" r="9" fill="#e2e8f0" />
  </g>

  <text x="330" y="500" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="96" fill="#ffffff">5 min</text>
  <text x="330" y="535" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="19" letter-spacing="2" fill="#93c5fd">TEMPO IDEAL DE RESPOSTA</text>

  <!-- Chat bubbles -->
  <g>
    <rect x="660" y="140" width="330" height="56" rx="18" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
    <text x="686" y="175" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#cbd5e1">Novo lead: Ana Paula 👋</text>

    <rect x="740" y="212" width="340" height="56" rx="18" fill="url(#accent)" />
    <text x="766" y="247" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="19" fill="#ffffff">Respondido em 3 min ✅</text>
  </g>

  <!-- Mini pipeline -->
  <g>
    <rect x="660" y="330" width="150" height="94" rx="16" fill="#111a33" stroke="#23304f" stroke-width="1.5" />
    <circle cx="690" cy="360" r="8" fill="#3b82f6" />
    <text x="708" y="366" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#e2e8f0">Novo</text>
    <text x="682" y="400" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#94a3b8">0-5 min</text>

    <path d="M818 377 L858 377" stroke="#334155" stroke-width="3" />
    <path d="M850 369 L862 377 L850 385" fill="none" stroke="#334155" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />

    <rect x="870" y="330" width="150" height="94" rx="16" fill="#111a33" stroke="#23304f" stroke-width="1.5" />
    <circle cx="900" cy="360" r="8" fill="#f59e0b" />
    <text x="918" y="366" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#e2e8f0">Contatado</text>
    <text x="892" y="400" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#94a3b8">Hoje</text>

    <path d="M1028 377 L1068 377" stroke="#334155" stroke-width="3" />
    <path d="M1060 369 L1072 377 L1060 385" fill="none" stroke="#334155" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />

    <rect x="1080" y="330" width="106" height="94" rx="16" fill="#111a33" stroke="#23304f" stroke-width="1.5" />
    <circle cx="1104" cy="360" r="8" fill="#10b981" />
    <text x="1122" y="366" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#e2e8f0">Ganho</text>
  </g>
</svg>
